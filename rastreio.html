<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EntreAqui - Rastreio ao Vivo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;font-family:system-ui,Arial}
  body{margin:0;background:#fff5ef;padding:15px}
  header{background:#ff5a00;color:#fff;padding:16px;text-align:center;font-weight:900;font-size:20px;border-radius:12px;margin-bottom:16px}
  .card{max-width:480px;margin:0 auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center}
  .status-box{background:#fff3e0;color:#e65100;padding:12px;border-radius:12px;font-weight:800;font-size:16px;margin:16px 0}
  .codigo-box{background:#f0fdf4;border:2px dashed #00a650;border-radius:12px;padding:16px;margin-top:20px}
  .codigo-num{font-size:32px;font-weight:900;color:#00a650;letter-spacing:4px;margin-top:5px}
  .small{font-size:13px;color:#666;line-height:1.5}
</style>
</head>
<body>

<header>📦 ENTREAQUI - RASTREIO AO VIVO</header>

<div class="card">
  <h2 id="nomeLojaRastreio" style="margin:0;color:#333">Carregando...</h2>
  <p class="small" id="detalhesPedido">Buscando informações do seu pedido...</p>

  <div id="statusBox" class="status-box">STATUS: CARREGANDO...</div>

  <div class="codigo-box">
    <div style="font-size:12px;font-weight:700;color:#333">🔑 SEU PIN DE CONFIRMAÇÃO</div>
    <div id="pinCliente" class="codigo-num">----</div>
    <div class="small" style="margin-top:8px">Informe este código ao entregador <b>somente ao receber</b> o pedido.</div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://omxfbskvrcbbrydgsmsg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Akx4rEvoEv4SHOx4ijG-vA_WmY-vU5-";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Pega o ID da entrega direto da URL (ex: rastreio.html?id=UUID)
  const urlParams = new URLSearchParams(window.location.search);
  const entregaId = urlParams.get('id');

  async function carregarRastreio() {
    if(!entregaId) {
      document.getElementById('nomeLojaRastreio').innerText = "Erro";
      document.getElementById('detalhesPedido').innerText = "Link de rastreio inválido ou ID não informado.";
      return;
    }

    try {
      const { data: entrega, error } = await db
        .from('entregas')
        .select('*')
        .eq('id', entregaId)
        .maybeSingle();

      if(error || !entrega) {
        document.getElementById('nomeLojaRastreio').innerText = "Pedido não encontrado";
        return;
      }

      document.getElementById('nomeLojaRastreio').innerText = entrega.loja_nome || "Loja Parceira";
      document.getElementById('detalhesPedido').innerHTML = `Cliente: <b>${entrega.cliente_nome}</b><br>Endereço: ${entrega.endereco}`;
      document.getElementById('pinCliente').innerText = entrega.codigo_entrega || "----";

      let statusTexto = "PENDENTE (Aguardando Motoboy Aceitar)";
      let corFundo = "#fff3e0";
      let corTexto = "#e65100";

      if(entrega.status === 'agendado') {
        statusTexto = "⏰ PEDIDO AGENDADO";
      } else if(['aceita', 'em_andamento', 'retirada'].includes(entrega.status)) {
        statusTexto = "🚀 PEDIDO A CAMINHO DA SUA CASA!";
        corFundo = "#e0f2fe";
        corTexto = "#0369a1";
      } else if(entrega.status === 'entregue') {
        statusTexto = "✅ PEDIDO ENTREGUE COM SUCESSO!";
        corFundo = "#f0fdf4";
        corTexto = "#166534";
      } else if(entrega.status === 'cancelado') {
        statusTexto = "❌ PEDIDO CANCELADO";
        corFundo = "#fee2e2";
        corTexto = "#991b1b";
      }

      const box = document.getElementById('statusBox');
      box.innerText = statusTexto;
      box.style.background = corFundo;
      box.style.color = corTexto;

    } catch(err) {
      console.error("Erro ao carregar rastreio:", err);
    }
  }

  carregarRastreio();
  // Atualiza o rastreio automaticamente a cada 5 segundos
  setInterval(carregarRastreio, 5000);
</script>
</body>
</html>
