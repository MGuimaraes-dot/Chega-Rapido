<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rastreio de Entrega - EntreAqui</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#fff5ef;padding:16px}
.card{max-width:480px;margin:20px auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center}
h2{margin-top:0;color:#ff5a00}
.status-badge{display:inline-block;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:800;background:#fff3e0;color:#e65100;margin:12px 0}
.info{text-align:left;font-size:14px;color:#333;margin-top:16px;line-height:1.5;background:#fafafa;padding:14px;border-radius:12px;border:1px solid #eee}
.pin-box{background:#f0fdf4;border:2px dashed #00a650;border-radius:12px;padding:14px;margin-top:16px}
.pin-num{font-size:32px;font-weight:900;color:#00a650;letter-spacing:4px}
</style></head><body>
<div class="card">
  <h2>📦 Rastreio EntreAqui</h2>
  <div id="statusEntrega" class="status-badge">Carregando status...</div>
  
  <div class="pin-box">
    <div style="font-size:12px;font-weight:700;color:#166534">🔑 SEU CÓDIGO PIN DE ENTREGA</div>
    <div id="pinCliente" class="pin-num">----</div>
    <div style="font-size:11px;color:#666">Apresente este código ao motoboy na entrega.</div>
  </div>

  <div class="info" id="detalhes">
    Buscando informações do pedido...
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const entregaId = params.get('id');

async function carregarRastreio(){
  if(!entregaId) {
    document.getElementById('statusEntrega').innerText = 'Link inválido';
    return;
  }
  const {data: e, error} = await supabaseClient.from('entregas').select('*').eq('id', entregaId).maybeSingle();
  if(error || !e){
    document.getElementById('statusEntrega').innerText = 'Entrega não encontrada';
    return;
  }

  document.getElementById('pinCliente').innerText = e.codigo_entrega || '----';
  
  let textoStatus = 'Aguardando Motoboy Aceitar';
  if(e.status === 'aceita') textoStatus = '🛵 Motoboy a caminho da Loja';
  if(e.status === 'retirada') textoStatus = '🚀 Pedido Retirado / Em Rota de Entrega';
  if(e.status === 'entregue') textoStatus = '✅ Pedido Entregue com Sucesso!';
  if(e.status === 'cancelado') textoStatus = '❌ Pedido Cancelado';

  document.getElementById('statusEntrega').innerText = textoStatus;

  document.getElementById('detalhes').innerHTML = `
    <b>Loja:</b> ${e.loja_nome || 'Estabelecimento'}<br>
    <b>Cliente:</b> ${e.cliente_nome}<br>
    <b>Endereço:</b> ${e.endereco}<br>
    ${e.motoboy_nome ? `<hr style="border:0;border-top:1px solid #ddd;margin:10px 0"><b>🛵 Motoboy:</b> ${e.motoboy_nome}<br><b>Placa da Moto:</b> ${e.motoboy_placa || 'Não informada'}` : '<br><small>Aguardando motoboy aceitar para ver dados da moto.</small>'}
  `;
}

carregarRastreio();
setInterval(carregarRastreio, 10000);
</script>
</body></html>
