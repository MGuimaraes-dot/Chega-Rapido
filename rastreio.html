<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EntreAqui - Rastreio ao Vivo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Leaflet CSS & JS para o Mapa ao Vivo -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{box-sizing:border-box;font-family:system-ui,Arial}
  body{margin:0;background:#fff5ef;padding:15px}
  header{background:#ff5a00;color:#fff;padding:16px;text-align:center;font-weight:900;font-size:20px;border-radius:12px;margin-bottom:16px}
  .card{max-width:480px;margin:0 auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center}
  .status-box{background:#fff3e0;color:#e65100;padding:12px;border-radius:12px;font-weight:800;font-size:16px;margin:16px 0}
  .codigo-box{background:#f0fdf4;border:2px dashed #00a650;border-radius:12px;padding:16px;margin-top:20px}
  .codigo-num{font-size:32px;font-weight:900;color:#00a650;letter-spacing:4px;margin-top:5px}
  .small{font-size:13px;color:#666;line-height:1.5}
  /* Estilo do Mapa de Rastreio */
  #mapaRastreio {
    width: 100%;
    height: 220px;
    border-radius: 12px;
    margin-top: 16px;
    display: none;
    border: 2px solid #ddd;
    z-index: 1;
  }
</style>
</head>
<body>

<header>📦 ENTREAQUI - RASTREIO AO VIVO</header>

<div class="card">
  <h2 id="nomeLojaRastreio" style="margin:0;color:#333">Carregando...</h2>
  <p class="small" id="detalhesPedido">Buscando informações do seu pedido...</p>

  <div id="statusBox" class="status-box">STATUS: CARREGANDO...</div>

  <div class="codigo-box">
    <div style="font-size:12px;font-weight:700;color:#333">🔑 SEU PIN DE CONFIRMAÇÃO</div>
    <div id="pinCliente" class="codigo-num">----</div>
    <div class="small" style="margin-top:8px">Informe este código ao entregador <b>somente ao receber</b> o pedido.</div>
  </div>

  <!-- MAPA QUE APARECE ABAIXO QUANDO O MOTOBOY ESTIVER EM ROTA -->
  <div id="mapaRastreio"></div>
</div>

<script>
  const SUPABASE_URL = "https://omxfbskvrcbbrydgsmsg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Akx4rEvoEv4SHOx4ijG-vA_WmY-vU5-";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const urlParams = new URLSearchParams(window.location.search);
  const entregaId = urlParams.get('id');

  let mapCliente = null;
  let marcadorMotoboy = null;

  async function carregarRastreio() {
    if(!entregaId) {
      document.getElementById('nomeLojaRastreio').innerText = "Erro";
      document.getElementById('detalhesPedido').innerText = "Link de rastreio inválido.";
      return;
    }

    try {
      const { data: entrega, error } = await db
        .from('entregas')
        .select('*')
        .eq('id', entregaId)
        .maybeSingle();

      if(error || !entrega) {
        document.getElementById('nomeLojaRastreio').innerText = "Pedido não encontrado";
        return;
      }

      document.getElementById('nomeLojaRastreio').innerText = entrega.loja_nome || "Loja Parceira";
      document.getElementById('detalhesPedido').innerHTML = `Cliente: <b>${entrega.cliente_nome}</b><br>Endereço: ${entrega.endereco}`;
      document.getElementById('pinCliente').innerText = entrega.codigo_entrega || "----";

      const box = document.getElementById('statusBox');
      const codigoBox = document.querySelector('.codigo-box');
      const divMapa = document.getElementById('mapaRastreio');

      if(entrega.status === 'cancelado') {
        box.innerText = "❌ ESTE PEDIDO FOI CANCELADO";
        box.style.background = "#fee2e2";
        box.style.color = "#991b1b";
        codigoBox.style.display = "none";
        divMapa.style.display = "none";
        return;
      }

      if(entrega.status === 'entregue') {
        box.innerText = "✅ PEDIDO JÁ ENTREGUE";
        box.style.background = "#f0fdf4";
        box.style.color = "#166534";
        codigoBox.style.display = "none";
        divMapa.style.display = "none";
        return;
      }

      codigoBox.style.display = "block";
      if(entrega.status === 'agendado') {
        box.innerText = "⏰ PEDIDO AGENDADO";
        box.style.background = "#fff3e0";
        box.style.color = "#e65100";
        divMapa.style.display = "none";
      } else if(['aceita', 'em_andamento', 'retirada'].includes(entrega.status)) {
        box.innerText = "🚀 PEDIDO A CAMINHO DA SUA CASA!";
        box.style.background = "#e0f2fe";
        box.style.color = "#0369a1";
        
        // Exibe e atualiza o mapa se o motoboy estiver a caminho
        divMapa.style.display = "block";
        atualizarMapaMotoboy(entrega.motoboy_id);

      } else {
        box.innerText = "📦 PENDENTE (Aguardando Motoboy)";
        box.style.background = "#fff3e0";
        box.style.color = "#e65100";
        divMapa.style.display = "none";
      }

    } catch(err) {
      console.error("Erro ao carregar rastreio:", err);
    }
  }

  async function atualizarMapaMotoboy(motoboyId) {
    if(!motoboyId) return;

    // Busca a posição atual do motoboy na tabela de motoboys
    const { data: motoboy } = await db
      .from('motoboys')
      .select('lat, lng, nome_completo, nome')
      .eq('id', motoboyId)
      .maybeSingle();

    if(motoboy && motoboy.lat && motoboy.lng) {
      if(!mapCliente) {
        mapCliente = L.map('mapaRastreio', { zoomControl: false }).setView([motoboy.lat, motoboy.lng], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(mapCliente);
      }
      setTimeout(() => mapCliente.invalidateSize(), 200);

      // Ícone limpo padronizado com a moto 🏍️
      const iconeMoto = L.divIcon({
        className: 'custom-moto-icon',
        html: '<div style="background:#28a745; color:#fff; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; box-shadow:0 4px 10px rgba(0,0,0,0.4); border:2px solid #fff;">🏍️</div>',
        iconSize: [38, 38],
        iconAnchor: [19, 19]
      });

      if(!marcadorMotoboy) {
        marcadorMotoboy = L.marker([motoboy.lat, motoboy.lng], {icon: iconeMoto}).addTo(mapCliente);
      } else {
        marcadorMotoboy.setLatLng([motoboy.lat, motoboy.lng]);
      }

      mapCliente.panTo([motoboy.lat, motoboy.lng]);
    }
  }

  carregarRastreio();
  setInterval(carregarRastreio, 5000);
</script>
</body>
</html>
