<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EntreAqui - Acesso</title>
<style>
  *{box-sizing:border-box;font-family:system-ui,Arial}
  body{margin:0;background:#fff5ef;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}
  .card{width:100%;max-width:400px;background:#fff;border-radius:20px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center}
  h2{margin-top:0;color:#111}
  .tabs{display:flex;background:#f1f1f1;border-radius:12px;padding:4px;margin-bottom:20px}
  .tabs button{flex:1;padding:12px;border:0;border-radius:10px;font-weight:800;cursor:pointer;background:transparent;font-size:14px;transition:0.2s}
  .tabs button.ativo-loja{background:#ff5a00;color:#fff}
  .tabs button.ativo-moto{background:#00a650;color:#fff}
  label{font-size:13px;font-weight:700;display:block;margin:12px 0 4px;text-align:left}
  input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:15px}
  .btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:16px;color:#fff}
  .btn-loja{background:#ff5a00}
  .btn-moto{background:#00a650}
  .link-cad{margin-top:16px;display:block;font-size:13px;color:#666;text-decoration:none;font-weight:700}
  .link-cad:hover{text-decoration:underline}
  #erro{color:#dc2626;margin-top:12px;font-size:13px;font-weight:700}
</style></head><body>

<div class="card">
  <div style="font-size:32px;margin-bottom:4px">📦</div>
  <h2>ENTREAQUI</h2>
  <p style="color:#666;font-size:13px;margin-top:0">Entre com sua conta para gerenciar pedidos.</p>

  <div class="tabs">
    <button type="button" id="tabLoja" class="ativo-loja" onclick="mudarTipo('loja')">🏪 Sou Loja</button>
    <button type="button" id="tabMoto" onclick="mudarTipo('moto')">🛵 Sou Motoboy</button>
  </div>

  <form id="formLogin" onsubmit="realizarLogin(event)">
    <label id="labelUser">CNPJ</label>
    <input id="usuario" placeholder="Digite apenas números" inputmode="numeric" required>

    <label>Senha</label>
    <input id="senha" type="password" placeholder="Sua senha" required>

    <button type="submit" id="btnEntrar" class="btn btn-loja">Entrar como Loja →</button>
  </form>

  <div id="erro"></div>
  <a id="linkCadastro" href="cadastro-loja.html" class="link-cad">Não tem cadastro? Cadastrar minha loja</a>
</div>

<script type="module">
  import { supabaseClient, soNumeros } from './supabase.js';

  let tipoAtual = 'loja';

  window.mudarTipo = function(tipo) {
    tipoAtual = tipo;
    const btnLoja = document.getElementById('tabLoja');
    const btnMoto = document.getElementById('tabMoto');
    const btnEntrar = document.getElementById('btnEntrar');
    const labelUser = document.getElementById('labelUser');
    const linkCad = document.getElementById('linkCadastro');
    const inputUser = document.getElementById('usuario');

    inputUser.value = '';
    document.getElementById('senha').value = '';
    document.getElementById('erro').innerText = '';

    if(tipo === 'loja') {
      btnLoja.className = 'ativo-loja';
      btnMoto.className = '';
      btnEntrar.className = 'btn btn-loja';
      btnEntrar.innerText = 'Entrar como Loja →';
      labelUser.innerText = 'CNPJ';
      inputUser.placeholder = 'Digite o CNPJ';
      linkCad.href = 'cadastro-loja.html';
      linkCad.innerText = 'Não tem cadastro? Cadastrar minha loja';
    } else {
      btnMoto.className = 'ativo-moto';
      btnLoja.className = '';
      btnEntrar.className = 'btn btn-moto';
      btnEntrar.innerText = 'Entrar como Motoboy →';
      labelUser.innerText = 'CPF';
      inputUser.placeholder = 'Digite o CPF';
      linkCad.href = 'cadastro-motoboy.html';
      linkCad.innerText = 'Não tem cadastro? Cadastrar como motoboy';
    }
  };

  window.realizarLogin = async function(event) {
    event.preventDefault();
    const btn = document.getElementById('btnEntrar');
    const erroDiv = document.getElementById('erro');
    erroDiv.innerText = '';
    btn.disabled = true;
    btn.innerText = 'Verificando...';

    const valorUser = soNumeros(document.getElementById('usuario').value);
    const senha = document.getElementById('senha').value.trim();

    try {
      if(tipoAtual === 'loja') {
        const { data, error } = await supabaseClient
          .from('lojas')
          .select('*')
          .eq('cnpj', valorUser)
          .maybeSingle();

        if(error || !data) throw new Error('CNPJ não encontrado ou incorreto.');
        if(data.status !== 'aprovado') throw new Error('Sua loja ainda está pendente de aprovação pelo administrador.');
        if(data.senha !== senha) throw new Error('Senha incorreta.');

        localStorage.setItem('loja', JSON.stringify(data));
        location.href = 'loja.html';

      } else {
        const { data, error } = await supabaseClient
          .from('motoboys')
          .select('*')
          .eq('cpf', valorUser)
          .maybeSingle();

        if(error || !data) throw new Error('CPF não encontrado ou incorreto.');
        if(data.status !== 'aprovado') throw new Error('Seu cadastro de motoboy ainda está pendente de aprovação.');
        if(data.senha !== senha) throw new Error('Senha incorreta.');

        localStorage.setItem('motoboy', JSON.stringify(data));
        location.href = 'motoboy.html';
      }
    } catch(e) {
      erroDiv.innerText = '❌ ' + e.message;
      btn.disabled = false;
      btn.innerText = tipoAtual === 'loja' ? 'Entrar como Loja →' : 'Entrar como Motoboy →';
    }
  };
</script>
</body></html>
