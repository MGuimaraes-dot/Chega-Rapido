<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EntreAqui - Painel Loja</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#fff5ef}
header{background:#ff5a00;color:#fff;padding:16px;text-align:center;font-weight:900;font-size:22px;position:relative}
.btn-config{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.card{max-width:480px;margin:16px auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
label{font-size:13px;font-weight:700;display:block;margin:12px 0 4px}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;font-size:14px}
.row{display:flex;gap:10px}.row>div{flex:1}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:12px}
.btn-orange{background:#ff5a00;color:#fff}.btn-green{background:#00a650;color:#fff}.btn-gray{background:#eee;color:#333}.btn-red{background:#fee2e2;color:#991b1b}
.item{border:1px solid #eee;border-radius:12px;padding:12px;margin-top:10px;background:#fafafa}
.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#fff3e0;color:#e65100}
.codigo-box{background:#fff3e0;border:2px dashed #ff5a00;border-radius:12px;padding:14px;text-align:center;margin-top:12px;display:none}
.codigo-num{font-size:28px;font-weight:900;color:#ff5a00;letter-spacing:3px}
#sugestoes{border:1px solid #ff5a00;border-radius:11px;margin-top:4px;overflow:hidden;display:none;background:#fff;position:relative;z-index:10}
#sugestoes div{padding:10px;border-bottom:1px solid #eee;cursor:pointer;font-size:13px}
#sugestoes div:hover{background:#fff5ef}
.config-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center}
.config-content{background:#fff;width:90%;max-width:420px;border-radius:16px;padding:20px;max-height:85vh;overflow-y:auto}
.frete-info{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:10px;border-radius:10px;font-size:13px;margin-top:8px;font-weight:700}
</style></head><body>
<header>
  📦 ENTREAQUI - LOJA
  <button class="btn-config" onclick="abrirConfig(true)" title="Configurações">⚙️</button>
</header>

<div id="modalConfig" class="config-modal">
  <div class="config-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">⚙️ Configurações & Extrato</h3>
      <button onclick="abrirConfig(false)" style="background:none;border:0;font-size:20px;cursor:pointer">✕</button>
    </div>
    
    <label>Nova Senha</label>
    <input id="novaSenhaLoja" type="password" placeholder="Nova senha">
    <button class="btn btn-green" onclick="salvarSenhaLoja()" style="margin-top:8px">Salvar Senha</button>
    
    <h3 style="font-size:15px;margin-top:20px">Extrato Financeiro</h3>
    <div id="extratoLoja" style="font-size:13px;color:#333">Calculando...</div>
    
    <h3 style="font-size:14px;margin-top:16px">📜 Histórico de Pedidos</h3>
    <div id="historicoLoja" style="max-height:180px;overflow-y:auto"></div>
    
    <button class="btn btn-gray" onclick="localStorage.clear();location.href='index.html'" style="margin-top:20px">Sair da Conta</button>
  </div>
</div>

<div class="card">
<h2 id="nomeLoja" style="margin:0">Loja</h2>
<p id="cnpjLoja" style="color:#666;margin:4px 0 0;font-size:13px"></p>
<p id="cidadeLoja" style="color:#00a650;font-weight:700;margin:6px 0 0;font-size:13px">📍 Detectando cidade...</p>
<p id="enderecoRetiradaInfo" style="color:#666;font-size:12px;margin:4px 0 0"></p>

<hr style="border:0;border-top:1px solid #eee;margin:16px 0">

<label>Nome do cliente *</label><input id="cliente" placeholder="Ex: João Silva">
<label>WhatsApp do cliente * (Ex: 17999999999)</label><input id="whatsappCliente" placeholder="DDD + Número" inputmode="tel">
<label>CEP (Opcional, ajuda a achar a rua)</label><input id="cep" placeholder="Somente números" maxlength="9" inputmode="numeric"><small id="cepMsg" style="color:#00a650;font-size:12px"></small>
<label>Endereço de Entrega *</label><input id="endereco" placeholder="Digite a rua..." autocomplete="off"><div id="sugestoes"></div>
<div class="row"><div><label>Número</label><input id="numero" placeholder="123"></div><div><label>Bairro</label><input id="bairro"></div></div>
<label>Cidade *</label><input id="cidade" placeholder="Cidade de entrega">
<label>Valor do Pedido R$ * (Pago pelo cliente na loja)</label><input id="valor" placeholder="0.00" inputmode="decimal">
<label>Observação / O que vai ser entregue</label><textarea id="obs" rows="2" placeholder="Ex: 1x Pizza de Calabresa..."></textarea>

<div id="fretePreview" class="frete-info" style="display:none">🚚 Calculando distância real...</div>

<div id="codigoBox" class="codigo-box">
<div style="font-size:12px;font-weight:700">🔑 PIN DE ENTREGA (CLIENTE)</div>
<div id="codigoNum" class="codigo-num">0000</div>
<div style="font-size:12px;color:#333;margin-top:6px">🔑 PIN DE RETIRADA (BALCÃO): <b id="codigoRetiradaNum" style="color:#ff5a00;font-size:16px">0000</b></div>
<a id="btnZapCliente" href="#" target="_blank" class="btn btn-green" style="margin-top:12px;text-decoration:none;display:block">📲 Enviar ZAP com Rastreio ao Cliente</a>
</div>

<button id="btnCriar" class="btn btn-orange" onclick="criar()">+ Criar Solicitação de Entrega</button>

<h3 style="font-size:15px;margin-top:22px">🚀 Pedidos Ativos na Praça</h3>
<div id="lista" style="margin-top:8px"></div><div id="erro" style="color:red;margin-top:10px;font-size:13px"></div>
</div>

<script>
const loja = getLoja(); if(!loja) location.href='index.html';
document.getElementById('nomeLoja').innerText = loja.nome_fantasia || loja.nome || 'Loja';
document.getElementById('cnpjLoja').innerText = 'CNPJ: ' + loja.cnpj;
document.getElementById('enderecoRetiradaInfo').innerText = '📦 Retirada: ' + (loja.endereco_retirada || loja.endereco || '');

function abrirConfig(abrir){
  document.getElementById('modalConfig').style.display = abrir ? 'flex' : 'none';
}

function setCidade(c){
  if(!c) return;
  document.getElementById('cidade').value=c;
  document.getElementById('cidadeLoja').innerText='📍 '+c;
  localStorage.setItem('cidade_atual', c);
}
const cidadeSalva = localStorage.getItem('cidade_atual');
if(cidadeSalva) setCidade(cidadeSalva);

if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
      const d=await r.json();
      const cidade=d.address.city||d.address.town||d.address.village||d.address.municipality;
      if(cidade) setCidade(cidade);
    }catch(e){}
  },()=>{}, {timeout:5000});
}

document.getElementById('cep').addEventListener('blur',async()=>{
  let cep=document.getElementById('cep').value.replace(/\D/g,''); if(cep.length!==8) return;
  document.getElementById('cepMsg').innerText='Buscando CEP...';
  try{
    const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`); const d=await r.json();
    if(d.erro){document.getElementById('cepMsg').innerText='CEP não encontrado';return;}
    document.getElementById('endereco').value=d.logradouro||''; document.getElementById('bairro').value=d.bairro||''; document.getElementById('cidade').value=d.localidade||'';
    document.getElementById('cepMsg').innerText='✅ Endereço preenchido';
    document.getElementById('numero').focus();
    atualizarPreviaFrete();
  }catch(e){document.getElementById('cepMsg').innerText='';}
});

let timer;
document.getElementById('endereco').addEventListener('input',()=>{
  clearTimeout(timer);
  const rua=document.getElementById('endereco').value.trim();
  const cidade=document.getElementById('cidade').value.trim()||'';
  const box=document.getElementById('sugestoes');
  if(rua.length<3){box.style.display='none';return;}
  timer=setTimeout(async()=>{
    try{
      const q = cidade ? rua + ', ' + cidade + ', Brasil' : rua + ', Brasil';
      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&q=${encodeURIComponent(q)}`);
      const dados=await r.json();
      if(!dados||!dados.length){box.style.display='none';return;}
      box.innerHTML=dados.map(d=>{
        const addr=d.address||{};
        const nomeRua=addr.road||addr.pedestrian||rua;
        const bairro=addr.suburb||addr.neighbourhood||'';
        const cidadeR=addr.city||addr.town||addr.village||cidade;
        return `<div onclick="escolherRua('${nomeRua.replace(/'/g,'')}','${bairro.replace(/'/g,'')}','${cidadeR.replace(/'/g,'')}')"><b>${nomeRua}</b><br><small>${bairro} - ${cidadeR}</small></div>`;
      }).join('');
      box.style.display='block';
    }catch(e){box.style.display='none';}
  },400);
});

document.getElementById('cidade').addEventListener('blur', atualizarPreviaFrete);

function escolherRua(rua,bairro,cidade){
  document.getElementById('endereco').value=rua;
  if(bairro) document.getElementById('bairro').value=bairro;
  if(cidade) document.getElementById('cidade').value=cidade;
  document.getElementById('sugestoes').style.display='none';
  document.getElementById('numero').focus();
  atualizarPreviaFrete();
}

// Busca coordenadas precisas em cascata (Endereço exato -> Rua + Cidade -> Cidade)
async function obterCoordenadas(enderecoTexto, cidadeTexto){
  const tentativas = [
    `${enderecoTexto}, ${cidadeTexto}, SP, Brasil`,
    `${enderecoTexto.split('-')[0].trim()}, ${cidadeTexto}, SP, Brasil`,
    `${cidadeTexto}, SP, Brasil`
  ];
  for(const query of tentativas){
    try{
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
      const d = await r.json();
      if(d && d[0]) return { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) };
    }catch(e){}
  }
  return null;
}

// Calcula distância real pela rua/rodovia via OSRM (fallback Haversine * 1.3)
async function calcularKm(enderecoEntrega, cidadeEntrega){
  const retiradaTexto = loja.endereco_retirada || loja.endereco || '';
  const cidadeLojaTexto = loja.cidade || cidadeSalva || 'Meridiano';

  const coordLoja = await obterCoordenadas(retiradaTexto, cidadeLojaTexto);
  const coordDestino = await obterCoordenadas(enderecoEntrega, cidadeEntrega);

  if(coordLoja && coordDestino){
    try{
      const urlOsrm = `https://router.project-osrm.org/route/v1/driving/${coordLoja.lng},${coordLoja.lat};${coordDestino.lng},${coordDestino.lat}?overview=false`;
      const r = await fetch(urlOsrm);
      const d = await r.json();
      if(d.routes && d.routes[0]){
        return Math.max(1, Math.round((d.routes[0].distance / 1000) * 10) / 10);
      }
    }catch(e){}

    // Fallback linha reta com fator de correção de rua (1.3x)
    const R=6371, dLat=(coordDestino.lat-coordLoja.lat)*Math.PI/180, dLon=(coordDestino.lng-coordLoja.lng)*Math.PI/180;
    const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(coordLoja.lat*Math.PI/180)*Math.cos(coordDestino.lat*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
    const distReta = R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    return Math.max(1, Math.round((distReta * 1.3) * 10) / 10);
  }
  return 3;
}

async function atualizarPreviaFrete(){
  const endereco = document.getElementById('endereco').value.trim();
  const cidade = document.getElementById('cidade').value.trim();
  if(!endereco || !cidade) return;
  
  const box = document.getElementById('fretePreview');
  box.style.display='block';
  box.innerText = '🚚 Calculando rota e frete...';

  let chovendo=false;
  try{ const {data: cfg} = await supabaseClient.from('config').select('*').eq('id',1).maybeSingle(); chovendo = cfg?.chovendo||false; }catch(e){}

  const km = await calcularKm(endereco, cidade);
  const valores = calcularValoresFrete(km, chovendo);
  
  box.innerHTML = `🚚 Rota estimada: <b>${km} km</b> | Frete Loja: <b>R$ ${valores.valorLoja.toFixed(2)}</b> ${chovendo ? '(🌧️ Com taxa de chuva)' : ''}`;
}

async function criar(){
  const btn = document.getElementById('btnCriar');
  btn.disabled = true; btn.innerText = 'Calculando rota e criando...';

  try {
    const cliente = document.getElementById('cliente').value.trim();
    let whatsappCliente = soNumeros(document.getElementById('whatsappCliente').value);
    const endereco = document.getElementById('endereco').value.trim();
    const cep = document.getElementById('cep').value;
    const bairro = document.getElementById('bairro').value;
    const cidade = document.getElementById('cidade').value.trim();
    const numero = document.getElementById('numero').value;
    const valor = document.getElementById('valor').value;
    const obs = document.getElementById('obs').value;
    
    if(!cliente || !whatsappCliente || !endereco || !valor || !cidade) {
      alert('Preencha cliente, WhatsApp, endereço, cidade e valor do pedido.');
      btn.disabled = false; btn.innerText = '+ Criar Solicitação de Entrega';
      return;
    }

    if(!whatsappCliente.startsWith('55') && whatsappCliente.length <= 11){
      whatsappCliente = '55' + whatsappCliente;
    }
    
    const codigoEntrega = Math.floor(1000 + Math.random()*9000).toString();
    const codigoRetirada = Math.floor(1000 + Math.random()*9000).toString();
    
    let chovendo=false;
    try{ const {data: cfg} = await supabaseClient.from('config').select('*').eq('id',1).maybeSingle(); chovendo = cfg?.chovendo||false; }catch(e){}
    
    const kmEst = await calcularKm(endereco + (numero ? ', ' + numero : ''), cidade);
    const valores = calcularValoresFrete(kmEst, chovendo);
    
    const {data: novaEntrega, error} = await supabaseClient.from('entregas').insert([{
      loja_id: loja.id, loja_nome: loja.nome_fantasia || loja.nome,
      cliente_nome: cliente, whatsapp_cliente: whatsappCliente,
      endereco: endereco + (numero ? ' - ' + numero : ''), cep, bairro, cidade,
      endereco_retirada: loja.endereco_retirada || loja.endereco,
      valor: parseFloat(valor.replace(',','.')), 
      valor_frete_loja: valores.valorLoja,
      valor_motoboy: valores.valorMotoboy, 
      distancia_km: kmEst, chovendo: chovendo,
      observacao: obs, status: 'pendente', 
      codigo_entrega: codigoEntrega, codigo_retirada: codigoRetirada
    }]).select().maybeSingle();
    
    if(error) throw error;
    
    document.getElementById('codigoBox').style.display='block';
    document.getElementById('codigoNum').innerText=codigoEntrega;
    document.getElementById('codigoRetiradaNum').innerText=codigoRetirada;
    
    // Constrói URL base limpa do GitHub Pages
    const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
    const linkRastreio = `${baseUrl}/rastreio.html?id=${novaEntrega.id}`;
    const msgZap = encodeURIComponent(`📦 *${loja.nome_fantasia || loja.nome}* - Seu pedido saiu para entrega!\n\n🔑 *PIN de Entrega:* ${codigoEntrega} (informe ao motoboy).\n\n📍 *Acompanhe ao vivo:*\n${linkRastreio}`);
    const urlWhats = `https://wa.me/${whatsappCliente}?text=${msgZap}`;
    
    const btnZap = document.getElementById('btnZapCliente');
    btnZap.href = urlWhats;

    // Limpa campos do formulário
    document.getElementById('cliente').value = '';
    document.getElementById('whatsappCliente').value = '';
    document.getElementById('endereco').value = '';
    document.getElementById('numero').value = '';
    document.getElementById('valor').value = '';
    document.getElementById('obs').value = '';

    carregar();
    
    // Abre o WhatsApp automaticamente para enviar ao cliente
    window.open(urlWhats, '_blank');
  } catch(e) {
    document.getElementById('erro').innerText = 'Erro ao criar: ' + e.message;
  } finally {
    btn.disabled = false;
    btn.innerText = '+ Criar Solicitação de Entrega';
  }
}

async function cancelarEntrega(id){
  if(!confirm('Deseja realmente cancelar este pedido de entrega?')) return;
  const {error} = await supabaseClient.from('entregas').update({status:'cancelado', cancelada_em: new Date().toISOString()}).eq('id',id).eq('status','pendente');
  if(error) return alert('Não é possível cancelar uma entrega que já foi aceita pelo motoboy.');
  alert('Entrega cancelada.');
  carregar();
}

async function carregar(){
  const {data} = await supabaseClient.from('entregas').select('*').eq('loja_id', loja.id).order('created_at',{ascending:false});
  
  const ativos = (data||[]).filter(e => ['pendente','aceita','retirada'].includes(e.status));
  const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
  
  document.getElementById('lista').innerHTML = ativos.map(e=>{
    const linkR = `${baseUrl}/rastreio.html?id=${e.id}`;
    const msgZ = encodeURIComponent(`📦 *${loja.nome_fantasia || loja.nome}* - Seu pedido saiu para entrega!\n\n🔑 *PIN de Entrega:* ${e.codigo_entrega}\n📍 *Rastreio:* ${linkR}`);
    return `
    <div class="item"><b>${e.cliente_nome}</b> - Pedido: R$ ${(e.valor||0).toFixed(2)}<br>
    <span class="small">${e.endereco} - ${e.bairro||''} - ${e.cidade||''} (${e.distancia_km||'?'} km)</span><br>
    <span class="badge">${e.status.toUpperCase()}</span> | <small>Frete: R$ ${(e.valor_frete_loja||0).toFixed(2)} ${e.chovendo?'(Chuva) ':''}</small>
    ${e.codigo_entrega ? `<br><b style="color:#ff5a00">🔑 PIN Cliente: ${e.codigo_entrega}</b> | <b>PIN Retirada: ${e.codigo_retirada||'N/A'}</b>` : ''}
    ${e.motoboy_nome ? `<br><small>🛵 Motoboy: <b>${e.motoboy_nome}</b> (Placa: ${e.motoboy_placa||'N/A'})</small>` : ''}
    ${e.whatsapp_cliente ? `<br><a href="https://wa.me/${e.whatsapp_cliente}?text=${msgZ}" target="_blank" style="display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:#00a650;text-decoration:none">📲 Reenviar ZAP ao Cliente</a>` : ''}
    ${e.status==='pendente' ? `<button class="btn btn-red" style="margin-top:8px;padding:8px" onclick="cancelarEntrega('${e.id}')">❌ Cancelar Pedido</button>` : ''}
    </div>`;
  }).join('')||'<p class="small">Nenhuma entrega ativa no momento.</p>';
  
  const historico = (data||[]).filter(e => ['entregue','cancelado'].includes(e.status));
  let totalValor = 0;
  historico.forEach(e => { if(e.status==='entregue') totalValor += Number(e.valor_frete_loja||0); });
  
  document.getElementById('extratoLoja').innerHTML = `Total de entregas concluídas: ${historico.filter(e=>e.status==='entregue').length}<br><b>Total de fretes a pagar à plataforma: R$ ${totalValor.toFixed(2)}</b>`;
  
  document.getElementById('historicoLoja').innerHTML = historico.map(e=>`
    <div class="item" style="background:#fff;padding:8px;margin-top:6px">
      <b>${e.cliente_nome}</b> - R$ ${(e.valor||0).toFixed(2)}<br>
      <span class="badge" style="background:${e.status==='entregue'?'#dcfce7':'#fee2e2'};color:${e.status==='entregue'?'#166534':'#991b1b'}">${e.status.toUpperCase()}</span>
      <small style="display:block;color:#666">Frete: R$ ${(e.valor_frete_loja||0).toFixed(2)} | Motoboy: ${e.motoboy_nome||'N/A'}</small>
    </div>`).join('')||'<p class="small">Nenhum pedido no histórico.</p>';
}

async function salvarSenhaLoja(){
  const nova = document.getElementById('novaSenhaLoja').value;
  if(!nova || nova.length < 4) return alert('Digite uma senha válida');
  const {error} = await supabaseClient.from('lojas').update({senha: nova}).eq('id', loja.id);
  if(error) return alert('Erro: '+error.message);
  alert('Senha alterada com sucesso!');
  document.getElementById('novaSenhaLoja').value='';
}

carregar();
setInterval(carregar, 10000);
</script>
</body></html>
