<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EntreAqui - Painel Loja</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#fff5ef}
header{background:#ff5a00;color:#fff;padding:16px;text-align:center;font-weight:900;font-size:22px}
.card{max-width:480px;margin:16px auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
label{font-size:13px;font-weight:700;display:block;margin:12px 0 4px}
input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;font-size:14px}
.row{display:flex;gap:10px}.row>div{flex:1}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:12px}
.btn-orange{background:#ff5a00;color:#fff}.btn-green{background:#00a650;color:#fff}.btn-gray{background:#eee;color:#333}
.item{border:1px solid #eee;border-radius:12px;padding:12px;margin-top:10px;background:#fafafa}
.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700;background:#fff3e0;color:#e65100}
.codigo-box{background:#fff3e0;border:2px dashed #ff5a00;border-radius:12px;padding:12px;text-align:center;margin-top:12px;display:none}
.codigo-num{font-size:32px;font-weight:900;color:#ff5a00;letter-spacing:4px}
#sugestoes{border:1px solid #ff5a00;border-radius:11px;margin-top:4px;overflow:hidden;display:none;background:#fff;position:relative;z-index:10}
#sugestoes div{padding:10px;border-bottom:1px solid #eee;cursor:pointer;font-size:13px}
#sugestoes div:hover{background:#fff5ef}
.config-box{display:none;background:#f9fafb;border:1px solid #eee;border-radius:12px;padding:14px;margin-top:12px}
</style></head><body>
<header>📦 ENTREAQUI - LOJA</header>
<div class="card">
<h2 id="nomeLoja" style="margin:0">Loja</h2>
<p id="cnpjLoja" style="color:#666;margin:4px 0 0;font-size:13px"></p>
<p id="cidadeLoja" style="color:#00a650;font-weight:700;margin:6px 0 0;font-size:13px">📍 Detectando cidade...</p>
<p id="enderecoRetiradaInfo" style="color:#666;font-size:12px;margin:4px 0 0"></p>

<button class="btn btn-gray" onclick="alternarConfig()" style="margin-top:12px">⚙️ Configurações & Financeiro</button>
<div id="boxConfig" class="config-box">
  <h3 style="margin-top:0;font-size:15px">Alterar Senha</h3>
  <label>Nova Senha</label>
  <input id="novaSenhaLoja" type="password" placeholder="Nova senha">
  <button class="btn.green btn" onclick="salvarSenhaLoja()" style="background:#00a650;color:#fff">Salvar Senha</button>
  
  <h3 style="font-size:15px;margin-top:16px">Extrato Financeiro</h3>
  <div id="extratoLoja" style="font-size:13px;color:#333">Calculando...</div>
</div>

<hr style="border:0;border-top:1px solid #eee;margin:16px 0">

<label>Nome do cliente *</label><input id="cliente" placeholder="Ex: João Silva">
<label>CEP *</label><input id="cep" placeholder="Somente números" maxlength="9" inputmode="numeric"><small id="cepMsg" style="color:#00a650;font-size:12px"></small>
<label>Endereço de Entrega *</label><input id="endereco" placeholder="Digite a rua..." autocomplete="off"><div id="sugestoes"></div>
<div class="row"><div><label>Número</label><input id="numero" placeholder="123"></div><div><label>Bairro</label><input id="bairro"></div></div>
<label>Cidade</label><input id="cidade" placeholder="Sua cidade">
<label>Valor R$ * (Valor do pedido pago pelo cliente)</label><input id="valor" placeholder="0.00" inputmode="decimal">
<label>Observação / O que vai ser entregue</label><textarea id="obs" rows="2" placeholder="Ex: 1x Pizza de Calabresa..."></textarea>

<div id="codigoBox" class="codigo-box">
<div style="font-size:12px;font-weight:700">🔑 CÓDIGO PIN DA ENTREGA</div>
<div id="codigoNum" class="codigo-num">0000</div>
<div style="font-size:11px;color:#666">Passe este código para o cliente. O motoboy precisará dele para finalizar.</div>
</div>

<button class="btn btn-orange" onclick="criar()">+ Criar Solicitação de Entrega</button>
<button class="btn btn-green" onclick="carregar()">Atualizar Entregas</button>
<button class="btn btn-gray" onclick="localStorage.clear();location.href='index.html'">Sair do Painel</button>

<div id="lista" style="margin-top:14px"></div><div id="erro" style="color:red;margin-top:10px;font-size:13px"></div>
</div>

<script>
const loja = getLoja(); if(!loja) location.href='index.html';
document.getElementById('nomeLoja').innerText = loja.nome_fantasia || loja.nome || 'Loja';
document.getElementById('cnpjLoja').innerText = 'CNPJ: ' + loja.cnpj;
document.getElementById('enderecoRetiradaInfo').innerText = '📦 Retirada: ' + (loja.endereco_retirada || loja.endereco || '');

function setCidade(c){
  if(!c) return;
  document.getElementById('cidade').value=c;
  document.getElementById('cidadeLoja').innerText='📍 '+c;
  localStorage.setItem('cidade_atual', c);
}
const cidadeSalva = localStorage.getItem('cidade_atual');
if(cidadeSalva) setCidade(cidadeSalva);

if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
      const d=await r.json();
      const cidade=d.address.city||d.address.town||d.address.village||d.address.municipality;
      if(cidade) setCidade(cidade);
    }catch(e){}
  },()=>{}, {timeout:5000});
}

document.getElementById('cep').addEventListener('blur',async()=>{
  let cep=document.getElementById('cep').value.replace(/\D/g,''); if(cep.length!==8) return;
  document.getElementById('cepMsg').innerText='Buscando CEP...';
  try{
    const r=await fetch(`https://viacep.com.br/ws/${cep}/json/`); const d=await r.json();
    if(d.erro){document.getElementById('cepMsg').innerText='CEP não encontrado';return;}
    document.getElementById('endereco').value=d.logradouro||''; document.getElementById('bairro').value=d.bairro||''; document.getElementById('cidade').value=d.localidade||'';
    document.getElementById('cepMsg').innerText='✅ Endereço preenchido';
    document.getElementById('numero').focus();
  }catch(e){document.getElementById('cepMsg').innerText='';}
});

let timer;
document.getElementById('endereco').addEventListener('input',()=>{
  clearTimeout(timer);
  const rua=document.getElementById('endereco').value.trim();
  const cidade=document.getElementById('cidade').value.trim()||'';
  const box=document.getElementById('sugestoes');
  if(rua.length<3){box.style.display='none';return;}
  timer=setTimeout(async()=>{
    try{
      const q = cidade ? rua + ', ' + cidade + ', Brasil' : rua + ', Brasil';
      const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&q=${encodeURIComponent(q)}`);
      const dados=await r.json();
      if(!dados||!dados.length){box.style.display='none';return;}
      box.innerHTML=dados.map(d=>{
        const addr=d.address||{};
        const nomeRua=addr.road||addr.pedestrian||rua;
        const bairro=addr.suburb||addr.neighbourhood||'';
        const cidadeR=addr.city||addr.town||addr.village||cidade;
        return `<div onclick="escolherRua('${nomeRua.replace(/'/g,'')}','${bairro.replace(/'/g,'')}','${cidadeR.replace(/'/g,'')}')"><b>${nomeRua}</b><br><small>${bairro} - ${cidadeR}</small></div>`;
      }).join('');
      box.style.display='block';
    }catch(e){box.style.display='none';}
  },400);
});

function escolherRua(rua,bairro,cidade){
  document.getElementById('endereco').value=rua;
  if(bairro) document.getElementById('bairro').value=bairro;
  if(cidade) document.getElementById('cidade').value=cidade;
  document.getElementById('sugestoes').style.display='none';
  document.getElementById('numero').focus();
}

async function calcularKm(enderecoEntrega, cidadeEntrega){
  try{
    const r1 = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(enderecoEntrega+', '+cidadeEntrega+', Brasil')}`);
    const d1 = await r1.json();
    const retirada = loja.endereco_retirada||loja.endereco||'';
    const r2 = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(retirada+', '+cidadeEntrega+', Brasil')}`);
    const d2 = await r2.json();
    if(d1[0] && d2[0]){
      const R=6371, dLat=(d1[0].lat-d2[0].lat)*Math.PI/180, dLon=(d1[0].lon-d2[0].lon)*Math.PI/180;
      const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(d2[0].lat*Math.PI/180)*Math.cos(d1[0].lat*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
      return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))*10)/10;
    }
  }catch(e){}
  return 3;
}

async function criar(){
  const cliente = document.getElementById('cliente').value.trim();
  const endereco = document.getElementById('endereco').value.trim();
  const cep = document.getElementById('cep').value;
  const bairro = document.getElementById('bairro').value;
  const cidade = document.getElementById('cidade').value;
  const numero = document.getElementById('numero').value;
  const valor = document.getElementById('valor').value;
  const obs = document.getElementById('obs').value;
  
  if(!cliente || !endereco || !valor || !cidade) return alert('Preencha cliente, endereço, cidade e valor');
  
  const codigo = Math.floor(1000 + Math.random()*9000).toString();
  
  let chovendo=false;
  try{ const {data: cfg} = await supabaseClient.from('config').select('*').eq('id',1).maybeSingle(); chovendo = cfg?.chovendo||false; }catch(e){}
  
  const kmEst = await calcularKm(endereco, cidade);
  const valorMotoboy = calcPreco(kmEst, chovendo);
  
  const {error} = await supabaseClient.from('entregas').insert([{
    loja_id: loja.id, loja_nome: loja.nome_fantasia || loja.nome,
    cliente_nome: cliente, endereco: endereco+' - '+numero, cep, bairro, cidade,
    endereco_retirada: loja.endereco_retirada || loja.endereco,
    valor: parseFloat(valor.replace(',','.')), valor_motoboy: valorMotoboy, distancia_km: kmEst, chovendo: chovendo,
    observacao: obs, status: 'pendente', codigo_entrega: codigo
  }]);
  
  if(error) document.getElementById('erro').innerText = 'Erro: '+error.message;
  else {
    document.getElementById('codigoBox').style.display='block';
    document.getElementById('codigoNum').innerText=codigo;
    alert('Entrega criada com sucesso! CÓDIGO PIN DO CLIENTE: ' + codigo);
    carregar();
  }
}

async function carregar(){
  const {data} = await supabaseClient.from('entregas').select('*').eq('loja_id', loja.id).order('created_at',{ascending:false});
  document.getElementById('lista').innerHTML = (data||[]).map(e=>`
    <div class="item"><b>${e.cliente_nome}</b> - R$ ${(e.valor||0).toFixed(2)}<br>
    <span class="small">${e.endereco} - ${e.bairro||''} - ${e.cidade||''}</span><br>
    <span class="badge">${e.status.toUpperCase()}</span> | <small>Frete: R$ ${(e.valor_motoboy||0).toFixed(2)} ${e.chovendo?'(Chuva) ':''}</small>
    ${e.codigo_entrega ? `<br><b style="color:#ff5a00">🔑 PIN: ${e.codigo_entrega}</b>` : ''}
    </div>`).join('')||'<p class="small">Nenhuma entrega cadastrada</p>';
  
  // Financeiro simples
  let totalValor = 0;
  (data||[]).forEach(e => { if(e.status==='entregue') totalValor += Number(e.valor||0); });
  document.getElementById('extratoLoja').innerHTML = `Total de entregas concluídas: ${(data||[]).filter(e=>e.status==='entregue').length}<br><b>Total faturado (a pagar): R$ ${totalValor.toFixed(2)}</b>`;
}

function alternarConfig(){
  const b = document.getElementById('boxConfig');
  b.style.display = b.style.display==='block' ? 'none' : 'block';
}

async function salvarSenhaLoja(){
  const nova = document.getElementById('novaSenhaLoja').value;
  if(!nova || nova.length < 4) return alert('Digite uma senha válida');
  const {error} = await supabaseClient.from('lojas').update({senha: nova}).eq('id', loja.id);
  if(error) return alert('Erro: '+error.message);
  alert('Senha alterada com sucesso!');
  document.getElementById('novaSenhaLoja').value='';
}

carregar();
setInterval(carregar, 12000);
</script>
</body></html>
