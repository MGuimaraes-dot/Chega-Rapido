<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EntreAqui - Painel Motoboy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#fff5ef}
header{background:#00a650;color:#fff;padding:16px;text-align:center;font-weight:900;font-size:22px;position:relative}
.btn-config{position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.card{max-width:480px;margin:16px auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px}
.btn-green{background:#00a650;color:#fff}.btn-orange{background:#ff5a00;color:#fff}.btn-gray{background:#eee;color:#333}.btn-blue{background:#1976d2;color:#fff}.btn-red{background:#fee2e2;color:#991b1b}
.item{border:1px solid #eee;border-radius:12px;padding:14px;margin-top:10px;background:#fafafa}
.item-aceita{border:2px solid #00a650;background:#f0fdf4}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;font-size:16px;margin-top:8px}
input.codigo{letter-spacing:6px;font-weight:900;text-align:center;font-size:20px}
.config-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center}
.config-content{background:#fff;width:90%;max-width:420px;border-radius:16px;padding:20px;max-height:85vh;overflow-y:auto}
#map { width: 100%; height: 280px; border-radius: 12px; margin-top: 12px; display: none; border: 2px solid #00a650; }
.row-botoes{display:flex;gap:8px;margin-top:8px}
</style></head><body>
<header>
  📦 ENTREAQUI - MOTOBOY
  <button class="btn-config" onclick="abrirConfig(true)" title="Configurações">⚙️</button>
</header>

<div id="modalConfig" class="config-modal">
  <div class="config-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">⚙️ Configurações & Ganhos</h3>
      <button onclick="abrirConfig(false)" style="background:none;border:0;font-size:20px;cursor:pointer">✕</button>
    </div>
    
    <label>Nova Senha</label>
    <input id="novaSenhaMoto" type="password" placeholder="Nova senha">
    <button class="btn btn-green" onclick="salvarSenhaMoto()" style="margin-top:8px">Salvar Senha</button>
    
    <h3 style="font-size:14px;margin-top:20px">Resumo de Ganhos</h3>
    <div id="extratoMoto" style="font-size:13px;color:#333">Calculando...</div>
    
    <button class="btn btn-gray" onclick="sair()" style="margin-top:20px">Sair do Painel</button>
  </div>
</div>

<div class="card">
<h2 id="nomeMoto" style="margin:0">Motoboy</h2>
<p id="cpfMoto" style="color:#666;margin:4px 0 0;font-size:13px"></p>
<p id="placaMoto" style="color:#666;margin:4px 0 0;font-size:13px"></p>

<button id="btnOnline" class="btn btn-green" onclick="alternarOnline()" style="margin-top:14px">🟢 Ficar Online</button>

<div id="areaAtiva" style="display:none">
  <h3 style="font-size:15px;margin-top:18px;color:#00a650">📦 Entrega em Andamento</h3>
  <div id="minhas"></div>
  <div id="map"></div>
  <a id="btnGpsExterno" href="#" target="_blank" class="btn btn-gray" style="text-decoration:none;display:block;text-align:center;font-size:13px;padding:10px">🗺️ Abrir Navegação por Voz (Google Maps)</a>
</div>

<div id="areaFila">
  <h3 style="font-size:15px;margin-top:18px">🔔 Pedidos Disponíveis na Fila</h3>
  <div id="lista"></div>
</div>
</div>

<script>
const motoData = getMotoboy(); if(!motoData) location.href='index.html';
let motoId = motoData.id;
let onlineAtual = false;
let map = null, markerMotoboy = null, markerDestino = null, rotaLayer = null;
let entregaRenderizadaId = null;
let entregaRenderizadaStatus = null;
let ultimoIdAlertado = null;
let audioCtx = null;

document.getElementById('nomeMoto').innerText = motoData.nome_completo || motoData.nome || 'Motoboy';
document.getElementById('cpfMoto').innerText = 'CPF: ' + motoData.cpf;
document.getElementById('placaMoto').innerText = 'Placa: ' + (motoData.placa_moto || motoData.placa || 'N/A');

function abrirConfig(abrir){
  document.getElementById('modalConfig').style.display = abrir ? 'flex' : 'none';
}

// Desbloqueia o áudio no toque do usuário e toca sirene dupla + vibração forte
function desbloquearAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}

function dispararAlertaNovoPedido(){
  try {
    if(navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 600]);
    desbloquearAudio();
    if(!audioCtx) return;

    const agora = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(660, agora);
    osc.frequency.setValueAtTime(880, agora + 0.25);
    osc.frequency.setValueAtTime(660, agora + 0.5);
    osc.frequency.setValueAtTime(880, agora + 0.75);

    gain.gain.setValueAtTime(0.5, agora);
    gain.gain.exponentialRampToValueAtTime(0.01, agora + 1.0);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(agora);
    osc.stop(agora + 1.0);
  } catch(e){}
}

async function sincronizarEstadoInicial(){
  const {data} = await supabaseClient.from('motoboys').select('online, status, bloqueado').eq('id', motoId).maybeSingle();
  if(data){
    if(data.bloqueado || data.status==='bloqueado'){
      alert('Sua conta foi bloqueada.');
      localStorage.removeItem('motoboy');
      location.href='index.html';
      return;
    }
    onlineAtual = !!data.online;
    atualizarBotaoOnlineVisual();
  }
}

function atualizarBotaoOnlineVisual(){
  const b = document.getElementById('btnOnline');
  b.innerText = onlineAtual ? '🔴 Ficar Offline' : '🟢 Ficar Online';
  b.style.background = onlineAtual ? '#fee2e2' : '#00a650';
  b.style.color = onlineAtual ? '#991b1b' : '#fff';
}

function sair(){
  supabaseClient.from('motoboys').update({online:false}).eq('id', motoId).then(()=>{
    localStorage.removeItem('motoboy'); location.href='index.html';
  });
}

async function alternarOnline(){
  desbloquearAudio();
  onlineAtual = !onlineAtual;
  await supabaseClient.from('motoboys').update({online: onlineAtual}).eq('id', motoId);
  atualizarBotaoOnlineVisual();
  if(onlineAtual && navigator.vibrate) navigator.vibrate(150);
  carregar(true);
}

async function carregar(forcarRender = false){
  // 1. Verifica se há entrega ativa
  const {data: minhas} = await supabaseClient.from('entregas').select('*').eq('motoboy_id', motoId).in('status',['aceita','retirada']).order('created_at',{ascending:false});
  const entregaAtiva = minhas && minhas.length > 0 ? minhas[0] : null;

  const areaAtiva = document.getElementById('areaAtiva');
  const areaFila = document.getElementById('areaFila');

  if(entregaAtiva){
    areaAtiva.style.display = 'block';
    areaFila.style.display = 'none';

    // SÓ redesenha o HTML do card se mudou o ID da entrega ou mudou de 'aceita' para 'retirada' (NÃO apaga o input enquanto digita!)
    if(forcarRender || entregaRenderizadaId !== entregaAtiva.id || entregaRenderizadaStatus !== entregaAtiva.status){
      entregaRenderizadaId = entregaAtiva.id;
      entregaRenderizadaStatus = entregaAtiva.status;

      document.getElementById('minhas').innerHTML = `
        <div class="item item-aceita"><b>${entregaAtiva.cliente_nome}</b> - Ganho: <b style="color:#00a650">R$ ${(entregaAtiva.valor_motoboy||0).toFixed(2)}</b><br>
        📦 <b>Loja:</b> ${entregaAtiva.loja_nome}<br>
        📍 <b>Retirar em:</b> ${entregaAtiva.endereco_retirada || 'Ver na loja'}<br>
        🏠 <b>Entregar em:</b> ${entregaAtiva.endereco} - ${entregaAtiva.bairro||''} (${entregaAtiva.cidade||''})<br>
        📏 ${entregaAtiva.distancia_km||'?'} km ${entregaAtiva.chovendo?'(🌧️ +R$ 2 chuva)':''}<br>
        
        ${entregaAtiva.status==='aceita' ? `
          <hr style="border:0;border-top:1px solid #bbf7d0;margin:10px 0">
          <label><b>🔑 PIN de Retirada (Peça no balcão da loja):</b></label>
          <input class="codigo" id="pinRetirada-${entregaAtiva.id}" placeholder="0000" maxlength="4" inputmode="numeric">
          <button class="btn btn-orange" onclick="confirmarRetirada('${entregaAtiva.id}')">📦 Confirmar Retirada do Pedido</button>
        ` : `
          <hr style="border:0;border-top:1px solid #bbf7d0;margin:10px 0">
          <p style="color:#00a650;font-weight:700;margin:6px 0">🚀 Pedido retirado! Rota traçada até o cliente.</p>
          <label><b>🔑 PIN de Entrega (Peça ao cliente):</b></label>
          <input class="codigo" id="pin-${entregaAtiva.id}" placeholder="0000" maxlength="4" inputmode="numeric">
          <button class="btn btn-blue" onclick="finalizar('${entregaAtiva.id}')">✅ Finalizar Entrega</button>
        `}
        </div>`;

      // Traça rota automática no GPS embutido para a Loja (se 'aceita') ou Cliente (se 'retirada')
      tracarRotaAutomatica(entregaAtiva);
    }
    return;
  } else {
    entregaRenderizadaId = null;
    entregaRenderizadaStatus = null;
    areaAtiva.style.display = 'none';
    areaFila.style.display = 'block';
  }

  // 2. Fila de pedidos disponíveis (somente se online e livre)
  const listaDiv = document.getElementById('lista');
  if(!onlineAtual){
    listaDiv.innerHTML = '<p style="font-size:13px;color:#666">Você está offline. Ligue o botão acima para receber corridas.</p>';
    atualizarExtrato();
    return;
  }

  const {data: pendentes} = await supabaseClient.from('entregas').select('*').eq('status','pendente').order('created_at',{ascending:true});
  const filtrados = (pendentes||[]).filter(e => !(e.recusados_por || []).includes(motoId));

  // Toca sirene e vibra toda vez que houver um pedido novo na fila que ainda não foi alertado
  if(filtrados.length > 0){
    const primeiroId = filtrados[0].id;
    if(ultimoIdAlertado !== primeiroId){
      ultimoIdAlertado = primeiroId;
      dispararAlertaNovoPedido();
    }
  } else {
    ultimoIdAlertado = null;
  }

  listaDiv.innerHTML = filtrados.map(e=>`
    <div class="item"><b>${e.cliente_nome}</b> - Ganho: <b style="color:#00a650;font-size:16px">R$ ${(e.valor_motoboy||0).toFixed(2)}</b><br>
    📦 Loja: ${e.loja_nome}<br>
    🏠 Destino: ${e.endereco} - ${e.cidade||''}<br>
    📏 ${e.distancia_km||'?'} km ${e.chovendo?'(🌧️ +R$ 2 chuva)':''}<br>
    <div class="row-botoes">
      <button class="btn btn-green" style="margin-top:8px;flex:2" onclick="aceitar('${e.id}')">✅ Aceitar Corrida</button>
      <button class="btn btn-red" style="margin-top:8px;flex:1" onclick="recusar('${e.id}')">❌ Recusar</button>
    </div></div>`).join('')||'<p style="font-size:13px;color:#666">Buscando pedidos na praça...</p>';

  atualizarExtrato();
}

async function tracarRotaAutomatica(entrega){
  const mapaDiv = document.getElementById('map');
  mapaDiv.style.display = 'block';

  if(!map){
    map = L.map('map').setView([-20.45, -50.55], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(map);
  }
  setTimeout(() => map.invalidateSize(), 200);

  // Define qual é o destino atual: Loja (se aceita) ou Cliente (se retirada)
  const enderecoAlvo = entrega.status === 'aceita' 
    ? `${entrega.endereco_retirada || ''}, ${entrega.cidade || ''}, Brasil`
    : `${entrega.endereco || ''}, ${entrega.cidade || ''}, Brasil`;

  document.getElementById('btnGpsExterno').href = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(enderecoAlvo)}&travelmode=driving`;

  // Busca coordenadas do destino
  let destLat = null, destLng = null;
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(enderecoAlvo)}`);
    const d = await r.json();
    if(d && d[0]){ destLat = parseFloat(d[0].lat); destLng = parseFloat(d[0].lon); }
  }catch(e){}

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async pos => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      const motoIcon = L.divIcon({
        html: '<div style="font-size:24px;background:#fff;border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)">🛵</div>',
        className: 'custom-moto-icon', iconSize: [38, 38], iconAnchor: [19, 19]
      });

      if(markerMotoboy) map.removeLayer(markerMotoboy);
      markerMotoboy = L.marker([lat, lng], {icon: motoIcon}).addTo(map).bindPopup('Você está aqui');

      if(destLat && destLng){
        const destIcon = L.divIcon({
          html: `<div style="font-size:22px;background:#ff5a00;color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)">${entrega.status==='aceita'?'🏪':'🏠'}</div>`,
          className: 'custom-dest-icon', iconSize: [34, 34], iconAnchor: [17, 17]
        });

        if(markerDestino) map.removeLayer(markerDestino);
        markerDestino = L.marker([destLat, destLng], {icon: destIcon}).addTo(map).bindPopup(entrega.status==='aceita' ? 'Retirar na Loja' : 'Entregar ao Cliente');

        // Desenha a linha azul da rota pelas ruas via OSRM
        try{
          const osrm = await fetch(`https://router.project-osrm.org/route/v1/driving/${lng},${lat};${destLng},${destLat}?overview=full&geometries=geojson`);
          const rotaData = await osrm.json();
          if(rotaData.routes && rotaData.routes[0]){
            if(rotaLayer) map.removeLayer(rotaLayer);
            rotaLayer = L.geoJSON(rotaData.routes[0].geometry, { style: { color: '#1976d2', weight: 5, opacity: 0.85 } }).addTo(map);
            map.fitBounds(rotaLayer.getBounds(), { padding: [30, 30] });
            return;
          }
        }catch(e){}
      }
      map.setView([lat, lng], 15);
    });
  }
}

async function atualizarExtrato(){
  const hojeStr = new Date().toISOString().split('T')[0];
  const {data: entregues} = await supabaseClient.from('entregas').select('*').eq('motoboy_id', motoId).eq('status','entregue');
  let ganhoHoje = 0, ganhoMes = 0, qtdHoje = 0, qtdMes = 0;
  const mesAtual = hojeStr.substring(0,7);

  (entregues||[]).forEach(e => {
    const val = Number(e.valor_motoboy || 0);
    const dataEntrega = (e.entregue_em || '').split('T')[0];
    if(dataEntrega === hojeStr){ ganhoHoje += val; qtdHoje++; }
    if(dataEntrega.startsWith(mesAtual)){ ganhoMes += val; qtdMes++; }
  });

  document.getElementById('extratoMoto').innerHTML = `
    <b>Hoje (${qtdHoje} entregas):</b> R$ ${ganhoHoje.toFixed(2)}<br>
    <b>Este Mês (${qtdMes} entregas):</b> R$ ${ganhoMes.toFixed(2)}<br>
    <small style="color:#666">Chave Pix: ${motoData.chave_pix || 'Não cadastrada'}</small>
  `;
}

async function aceitar(id){
  desbloquearAudio();
  const {data, error} = await supabaseClient.from('entregas').update({
    status: 'aceita', 
    motoboy_id: motoId, 
    motoboy_nome: motoData.nome_completo || motoData.nome,
    motoboy_placa: motoData.placa_moto || motoData.placa,
    aceita_em: new Date().toISOString()
  }).eq('id', id).eq('status','pendente').select().maybeSingle();

  if(error || !data) return alert('Esta corrida já foi aceita por outro motoboy.');
  
  await supabaseClient.from('motoboys').update({total_aceitas: (motoData.total_aceitas || 0) + 1}).eq('id', motoId);
  carregar(true);
}

async function recusar(id){
  desbloquearAudio();
  const {data: ent} = await supabaseClient.from('entregas').select('recusados_por').eq('id', id).maybeSingle();
  const lista = ent?.recusados_por || [];
  if(!lista.includes(motoId)) lista.push(motoId);

  await supabaseClient.from('entregas').update({recusados_por: lista}).eq('id', id);
  ultimoIdAlertado = null;
  carregar(true);
}

async function confirmarRetirada(id){
  const pinInput = document.getElementById('pinRetirada-'+id).value.trim();
  if(!pinInput || pinInput.length !== 4) return alert('Digite o PIN de 4 dígitos informado pela loja.');
  
  const {data} = await supabaseClient.from('entregas').select('codigo_retirada').eq('id', id).maybeSingle();
  if(!data || pinInput !== data.codigo_retirada) return alert('❌ PIN de retirada incorreto!');

  await supabaseClient.from('entregas').update({status: 'retirada', retirada_confirmada: true, coletada_em: new Date().toISOString()}).eq('id', id);
  carregar(true);
}

async function finalizar(id){
  const pin = document.getElementById('pin-'+id).value.trim();
  if(!pin || pin.length!==4) return alert('Digite o PIN de 4 dígitos do cliente');
  
  const {data} = await supabaseClient.from('entregas').select('codigo_entrega').eq('id',id).maybeSingle();
  if(!data || pin !== data.codigo_entrega) return alert('❌ PIN do cliente incorreto!');
  
  await supabaseClient.from('entregas').update({status:'entregue', entregue_em: new Date().toISOString(), codigo_confirmado:true}).eq('id',id);
  alert('✅ Entrega finalizada com sucesso!');
  carregar(true);
}

async function salvarSenhaMoto(){
  const nova = document.getElementById('novaSenhaMoto').value;
  if(!nova || nova.length<4) return alert('Senha inválida');
  const {error} = await supabaseClient.from('motoboys').update({senha: nova}).eq('id', motoId);
  if(error) return alert('Erro: '+error.message);
  alert('Senha alterada com sucesso!');
  document.getElementById('novaSenhaMoto').value='';
}

sincronizarEstadoInicial().then(() => carregar(true));

// Só busca novas corridas em segundo plano se NÃO houver entrega ativa (não apaga mais o PIN enquanto digita!)
setInterval(()=>{ 
  if(onlineAtual && !entregaRenderizadaId) carregar(false); 
}, 5000);
</script>
</body></html>
