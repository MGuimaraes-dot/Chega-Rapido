<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EntreAqui - Painel Motoboy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#fff5ef}
header{background:#00a650;color:#fff;padding:16px;text-align:center;font-weight:900;font-size:22px}
.card{max-width:480px;margin:16px auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px}
.btn-green{background:#00a650;color:#fff}.btn-orange{background:#ff5a00;color:#fff}.btn-gray{background:#eee;color:#333}.btn-blue{background:#1976d2;color:#fff}
.item{border:1px solid #eee;border-radius:12px;padding:14px;margin-top:10px;background:#fafafa}
.item-aceita{border:2px solid #00a650;background:#f0fdf4}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;font-size:15px;margin-top:8px}
input.codigo{letter-spacing:4px;font-weight:900;text-align:center}
.status-box{padding:12px;border-radius:12px;text-align:center;font-weight:800;font-size:14px;margin-top:10px}
.status-analise{background:#fef3c7;color:#92400e}
.status-aprovado{background:#dcfce7;color:#166534}
.status-bloqueado{background:#fee2e2;color:#991b1b}
.config-box{display:none;background:#f9fafb;border:1px solid #eee;border-radius:12px;padding:14px;margin-top:10px}
</style></head><body>
<header>📦 ENTREAQUI - MOTOBOY</header>
<div class="card">
<h2 id="nomeMoto" style="margin:0">Motoboy</h2>
<p id="cpfMoto" style="color:#666;margin:4px 0 0;font-size:13px"></p>
<p id="placaMoto" style="color:#666;margin:4px 0 0;font-size:13px"></p>
<div id="statusBox" class="status-box status-analise">Carregando status...</div>

<button id="btnOnline" class="btn btn-green" onclick="alternarOnline()">🟢 Ficar Online</button>
<p id="posFila" style="text-align:center;color:#666;font-size:12px;margin:6px 0 0"></p>

<button class="btn btn-gray" onclick="alternarConfig()">⚙️ Configurações & Ganhos</button>
<div id="boxConfig" class="config-box">
  <h3 style="margin-top:0;font-size:14px">Alterar Senha</h3>
  <label>Nova Senha</label>
  <input id="novaSenhaMoto" type="password" placeholder="Nova senha">
  <button class="btn btn-green" onclick="salvarSenhaMoto()">Salvar Senha</button>
  <h3 style="font-size:14px;margin-top:14px">Meus Ganhos</h3>
  <div id="extratoMoto" style="font-size:13px;color:#333">Calculando...</div>
</div>

<button class="btn.green btn" onclick="carregar()" style="background:#00a650;color:#fff;margin-top:12px">🔄 Atualizar Entregas</button>

<h3 style="font-size:15px">📦 Minhas Entregas em Andamento</h3>
<div id="minhas"></div>

<h3 style="font-size:15px">🔔 Pedidos Disponíveis na Fila</h3>
<div id="lista"></div>

<button class="btn btn-gray" onclick="sair()" style="margin-top:20px">Sair do Painel</button>
</div>

<script>
const moto = getMotoboy(); if(!moto) location.href='index.html';
let onlineAtual = !!moto.online;

function atualizarBotaoOnline(){
  const b = document.getElementById('btnOnline');
  b.innerText = onlineAtual ? '🔴 Ficar Offline' : '🟢 Ficar Online';
  b.style.background = onlineAtual ? '#fee2e2' : '#00a650';
  b.style.color = onlineAtual ? '#991b1b' : '#fff';
}
atualizarBotaoOnline();

function sair(){
  supabaseClient.from('motoboys').update({online:false}).eq('id', moto.id).then(()=>{
    localStorage.removeItem('motoboy'); location.href='index.html';
  });
}

async function verificarStatus(){
  const {data} = await supabaseClient.from('motoboys').select('*').eq('id', moto.id).maybeSingle();
  if(!data) return 'analise';
  if(data.bloqueado || data.status==='bloqueado') return 'bloqueado';
  if(data.aprovado || data.status==='aprovado') return 'aprovado';
  return 'analise';
}

async function alternarOnline(){
  const status = await verificarStatus();
  if(status !== 'aprovado') return alert('Seu cadastro ainda está em análise ou bloqueado.');
  onlineAtual = !onlineAtual;
  await supabaseClient.from('motoboys').update({online: onlineAtual}).eq('id', moto.id);
  atualizarBotaoOnline();
  if(onlineAtual && navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async p=>{
      await supabaseClient.from('motoboys').update({lat: p.coords.latitude, lng: p.coords.longitude}).eq('id', moto.id);
    });
  }
  carregar();
}

async function carregar(){
  const status = await verificarStatus();
  const box = document.getElementById('statusBox');
  if(status==='aprovado'){
    box.className='status-box status-aprovado'; box.innerText='🟢 APROVADO - Pronto para entregas';
  } else if(status==='bloqueado'){
    box.className='status-box status-bloqueado'; box.innerText='🔴 BLOQUEADO PELA ADMINISTRAÇÃO';
    return;
  } else {
    box.className='status-box status-analise'; box.innerText='🟡 EM ANÁLISE - Aguarde aprovação';
    return;
  }

  // Minhas entregas aceitas
  const {data: minhas} = await supabaseClient.from('entregas').select('*').eq('motoboy_id', moto.id).in('status',['aceita','retirada']).order('created_at',{ascending:false});
  document.getElementById('minhas').innerHTML = (minhas||[]).map(e=>{
    const mapa = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(e.endereco+', '+(e.cidade||''))}`;
    return `<div class="item item-aceita"><b>${e.cliente_nome}</b> - R$ ${(e.valor_motoboy||0).toFixed(2)}<br>
    📦 <b>Retirar em:</b> ${e.endereco_retirada||''}<br>
    🏠 <b>Entregar em:</b> ${e.endereco} - ${e.cidade||''}<br>
    📏 ${e.distancia_km||'?'} km ${e.chovendo?'(🌧️ +R$ 2 chuva)':''}<br>
    <a href="${mapa}" target="_blank" style="display:block;text-align:center;padding:10px;background:#1976d2;color:#fff;border-radius:10px;margin-top:8px;text-decoration:none;font-weight:700">🗺️ Abrir Rota no GPS</a>
    ${e.status==='aceita' ? `<button class="btn.orange btn" onclick="retirar('${e.id}')" style="background:#ff5a00;color:#fff">📦 Marcar como Retirado</button>` : `<p style="color:#00a650;font-weight:700;margin:6px 0">🚀 Em rota de entrega</p>`}
    <label>Digite o PIN de 4 dígitos do Cliente:</label>
    <input class="codigo" id="pin-${e.id}" placeholder="0000" maxlength="4" inputmode="numeric">
    <button class="btn btn-blue" onclick="finalizar('${e.id}')">✅ Confirmar Entrega</button></div>`;
  }).join('')||'<p style="font-size:13px;color:#666">Nenhuma entrega em andamento</p>';

  // Fila de pendentes
  if(!onlineAtual){
    document.getElementById('lista').innerHTML='<p style="font-size:13px;color:#666">Você está offline.</p>';
    return;
  }
  const {data: pendentes} = await supabaseClient.from('entregas').select('*').eq('status','pendente').order('created_at',{ascending:true});
  document.getElementById('lista').innerHTML = (pendentes||[]).map(e=>`
    <div class="item"><b>${e.cliente_nome}</b> - R$ ${(e.valor_motoboy||0).toFixed(2)}<br>
    📦 Retirada: ${e.endereco_retirada||''}<br>
    🏠 Destino: ${e.endereco} - ${e.cidade||''}<br>
    📏 ${e.distancia_km||'?'} km<br>
    <button class="btn btn-orange" onclick="aceitar('${e.id}')">✅ Aceitar Corrida</button></div>`).join('')||'<p style="font-size:13px;color:#666">Nenhuma entrega na fila no momento.</p>';

  // Extrato financeiro
  const {data: entregues} = await supabaseClient.from('entregas').select('*').eq('motoboy_id', moto.id).eq('status','entregue');
  let totalGanhos = 0;
  (entregues||[]).forEach(e => totalGanhos += Number(e.valor_motoboy||0));
  document.getElementById('extratoMoto').innerHTML = `Total de entregas: ${(entregues||[]).length}<br><b>Total a receber via Pix: R$ ${totalGanhos.toFixed(2)}</b><br><small>Chave Pix: ${moto.chave_pix||'Não cadastrada'}</small>`;
}

async function aceitar(id){
  const {error} = await supabaseClient.from('entregas').update({status:'aceita', motoboy_id: moto.id, aceita_em: new Date().toISOString()}).eq('id', id).eq('status','pendente');
  if(error) return alert('Corrida já foi aceita por outro motoboy.');
  alert('Entrega aceita! Dirija-se ao local de retirada.');
  carregar();
}

async function retirar(id){
  await supabaseClient.from('entregas').update({status:'retirada'}).eq('id', id);
  carregar();
}

async function finalizar(id){
  const pin = document.getElementById('pin-'+id).value.trim();
  if(!pin || pin.length!==4) return alert('Digite o PIN de 4 dígitos informado pelo cliente');
  const {data} = await supabaseClient.from('entregas').select('codigo_entrega').eq('id',id).maybeSingle();
  if(!data || pin !== data.codigo_entrega) return alert('❌ PIN incorreto! Confirme o número com o cliente.');
  
  await supabaseClient.from('entregas').update({status:'entregue', entregue_em: new Date().toISOString(), codigo_confirmado:true}).eq('id',id);
  alert('✅ Entrega finalizada com sucesso! Bom trabalho.');
  carregar();
}

function alternarConfig(){
  const b = document.getElementById('boxConfig');
  b.style.display = b.style.display==='block' ? 'none' : 'block';
}

async function salvarSenhaMoto(){
  const nova = document.getElementById('novaSenhaMoto').value;
  if(!nova || nova.length<4) return alert('Senha inválida');
  const {error} = await supabaseClient.from('motoboys').update({senha: nova}).eq('id', moto.id);
  if(error) return alert('Erro: '+error.message);
  alert('Senha alterada com sucesso!');
  document.getElementById('novaSenhaMoto').value='';
}

carregar();
setInterval(()=>{ if(onlineAtual) carregar(); }, 10000);
</script>
</body></html>
