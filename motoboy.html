<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EntreAqui - Painel Motoboy</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<!-- Leaflet CSS para o Mapa -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#fff5ef}
header{background:#00a650;color:#fff;padding:16px;text-align:center;font-weight:900;font-size:22px}
.card{max-width:480px;margin:16px auto;background:#fff;border-radius:18px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px}
.btn-green{background:#00a650;color:#fff}.btn-orange{background:#ff5a00;color:#fff}.btn-gray{background:#eee;color:#333}.btn-blue{background:#1976d2;color:#fff}.btn-red{background:#fee2e2;color:#991b1b}
.item{border:1px solid #eee;border-radius:12px;padding:14px;margin-top:10px;background:#fafafa}
.item-aceita{border:2px solid #00a650;background:#f0fdf4}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;font-size:15px;margin-top:8px}
input.codigo{letter-spacing:4px;font-weight:900;text-align:center}
.status-box{padding:12px;border-radius:12px;text-align:center;font-weight:800;font-size:14px;margin-top:10px}
.status-analise{background:#fef3c7;color:#92400e}
.status-aprovado{background:#dcfce7;color:#166534}
.status-bloqueado{background:#fee2e2;color:#991b1b}
.config-box{display:none;background:#f9fafb;border:1px solid #eee;border-radius:12px;padding:14px;margin-top:10px}
#map { width: 100%; height: 260px; border-radius: 12px; margin-top: 12px; display: none; }
.row-botoes{display:flex;gap:8px;margin-top:8px}
</style></head><body>
<header>📦 ENTREAQUI - MOTOBOY</header>
<div class="card">
<h2 id="nomeMoto" style="margin:0">Motoboy</h2>
<p id="cpfMoto" style="color:#666;margin:4px 0 0;font-size:13px"></p>
<p id="placaMoto" style="color:#666;margin:4px 0 0;font-size:13px"></p>
<div id="statusBox" class="status-box status-analise">Carregando status...</div>

<button id="btnOnline" class="btn btn-green" onclick="alternarOnline()">🟢 Ficar Online</button>

<button class="btn btn-gray" onclick="alternarConfig()" style="margin-top:12px">⚙️ Configurações & Meus Ganhos</button>
<div id="boxConfig" class="config-box">
  <h3 style="margin-top:0;font-size:14px">Alterar Senha</h3>
  <label>Nova Senha</label>
  <input id="novaSenhaMoto" type="password" placeholder="Nova senha">
  <button class="btn btn-green" onclick="salvarSenhaMoto()">Salvar Senha</button>
  <h3 style="font-size:14px;margin-top:14px">Resumo de Ganhos</h3>
  <div id="extratoMoto" style="font-size:13px;color:#333">Calculando...</div>
</div>

<button class="btn btn-green" onclick="carregar()" style="margin-top:12px">🔄 Atualizar Entregas</button>

<h3 style="font-size:15px">📦 Minha Entrega Ativa</h3>
<div id="minhas"></div>
<div id="map"></div>

<h3 style="font-size:15px">🔔 Pedidos Disponíveis na Fila</h3>
<div id="lista"></div>

<button class="btn btn-gray" onclick="sair()" style="margin-top:20px">Sair do Painel</button>
</div>

<script>
const motoData = getMotoboy(); if(!motoData) location.href='index.html';
let motoId = motoData.id;
let onlineAtual = false;
let map = null, markerMotoboy = null, markerDestino = null;

document.getElementById('nomeMoto').innerText = motoData.nome_completo || motoData.nome || 'Motoboy';
document.getElementById('cpfMoto').innerText = 'CPF: ' + motoData.cpf;
document.getElementById('placaMoto').innerText = 'Placa: ' + (motoData.placa_moto || motoData.placa || 'N/A');

// Sincroniza estado online inicial do banco
async function sincronizarEstadoInicial(){
  const {data} = await supabaseClient.from('motoboys').select('online, status, bloqueado').eq('id', motoId).maybeSingle();
  if(data){
    onlineAtual = !!data.online;
    atualizarBotaoOnlineVisual();
  }
}

function atualizarBotaoOnlineVisual(){
  const b = document.getElementById('btnOnline');
  b.innerText = onlineAtual ? '🔴 Ficar Offline' : '🟢 Ficar Online';
  b.style.background = onlineAtual ? '#fee2e2' : '#00a650';
  b.style.color = onlineAtual ? '#991b1b' : '#fff';
}

function tocarAlertaSonoro(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = 587.33; // D5
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.4);
    if(navigator.vibrate) navigator.vibrate([300, 150, 300]);
  } catch(e){}
}

function sair(){
  supabaseClient.from('motoboys').update({online:false}).eq('id', motoId).then(()=>{
    localStorage.removeItem('motoboy'); location.href='index.html';
  });
}

async function verificarStatus(){
  const {data} = await supabaseClient.from('motoboys').select('*').eq('id', motoId).maybeSingle();
  if(!data) return 'analise';
  if(data.bloqueado || data.status==='bloqueado') return 'bloqueado';
  if(data.aprovado || data.status==='aprovado') return 'aprovado';
  return 'analise';
}

async function alternarOnline(){
  const status = await verificarStatus();
  if(status !== 'aprovado') return alert('Seu cadastro ainda está em análise ou bloqueado pela administração.');
  
  onlineAtual = !onlineAtual;
  await supabaseClient.from('motoboys').update({online: onlineAtual}).eq('id', motoId);
  atualizarBotaoOnlineVisual();
  
  if(onlineAtual && navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async p=>{
      await supabaseClient.from('motoboys').update({lat: p.coords.latitude, lng: p.coords.longitude}).eq('id', motoId);
    });
  }
  carregar();
}

async function carregar(){
  const status = await verificarStatus();
  const box = document.getElementById('statusBox');
  if(status==='aprovado'){
    box.className='status-box status-aprovado'; box.innerText='🟢 APROVADO - Pronto para entregas';
  } else if(status==='bloqueado'){
    box.className='status-box status-bloqueado'; box.innerText='🔴 BLOQUEADO PELA ADMINISTRAÇÃO';
    return;
  } else {
    box.className='status-box status-analise'; box.innerText='🟡 EM ANÁLISE - Aguarde aprovação';
    return;
  }

  // 1. Minha entrega ativa (aceita ou retirada)
  const {data: minhas} = await supabaseClient.from('entregas').select('*').eq('motoboy_id', motoId).in('status',['aceita','retirada']).order('created_at',{ascending:false});
  const entregaAtiva = minhas && minhas.length > 0 ? minhas[0] : null;

  const divMinhas = document.getElementById('minhas');
  const mapaDiv = document.getElementById('map');

  if(entregaAtiva){
    mapaDiv.style.display = 'block';
    inicializarMapa(entregaAtiva);

    divMinhas.innerHTML = `
      <div class="item item-aceita"><b>${entregaAtiva.cliente_nome}</b> - R$ ${(entregaAtiva.valor_motoboy||0).toFixed(2)}<br>
      📦 <b>Retirar na Loja:</b> ${entregaAtiva.loja_nome}<br>
      📍 <b>Endereço Loja:</b> ${entregaAtiva.endereco_retirada || 'Ver na loja'}<br>
      🏠 <b>Entregar em:</b> ${entregaAtiva.endereco} - ${entregaAtiva.bairro||''} (${entregaAtiva.cidade||''})<br>
      📏 ${entregaAtiva.distancia_km||'?'} km ${entregaAtiva.chovendo?'(🌧️ +R$ 2 chuva)':''}<br>
      
      ${entregaAtiva.status==='aceita' ? `
        <hr style="border:0;border-top:1px solid #bbf7d0;margin:10px 0">
        <label><b>🔑 Digite o PIN de Retirada da Loja:</b></label>
        <input class="codigo" id="pinRetirada-${entregaAtiva.id}" placeholder="0000" maxlength="4" inputmode="numeric">
        <button class="btn btn-orange" onclick="confirmarRetirada('${entregaAtiva.id}')">📦 Informar PIN e Retirar Pedido</button>
      ` : `
        <hr style="border:0;border-top:1px solid #bbf7d0;margin:10px 0">
        <p style="color:#00a650;font-weight:700;margin:6px 0">🚀 Pedido retirado! Siga para o cliente.</p>
        <label><b>🔑 Digite o PIN de 4 dígitos do Cliente:</b></label>
        <input class="codigo" id="pin-${entregaAtiva.id}" placeholder="0000" maxlength="4" inputmode="numeric">
        <button class="btn btn-blue" onclick="finalizar('${entregaAtiva.id}')">✅ Confirmar Entrega</button>
      `}
      </div>`;
  } else {
    mapaDiv.style.display = 'none';
    divMinhas.innerHTML = '<p style="font-size:13px;color:#666">Nenhuma entrega em andamento.</p>';
  }

  // 2. Fila de pedidos disponíveis (somente se online e sem entrega ativa)
  if(!onlineAtual || entregaAtiva){
    document.getElementById('lista').innerHTML = !onlineAtual ? '<p style="font-size:13px;color:#666">Você está offline. Fique online para receber corridas.</p>' : '<p style="font-size:13px;color:#666">Você já possui uma entrega em andamento.</p>';
    return;
  }

  const {data: pendentes} = await supabaseClient.from('entregas').select('*').eq('status','pendente').order('created_at',{ascending:true});
  
  // Filtra pedidos que este motoboy já recusou
  const filtrados = (pendentes||[]).filter(e => {
    const recusados = e.recusados_por || [];
    return !recusados.includes(motoId);
  });

  if(filtrados.length > 0){
    tocarAlertaSonoro();
  }

  document.getElementById('lista').innerHTML = filtrados.map(e=>`
    <div class="item"><b>${e.cliente_nome}</b> - Ganho: <b style="color:#00a650">R$ ${(e.valor_motoboy||0).toFixed(2)}</b><br>
    📦 Loja: ${e.loja_nome}<br>
    🏠 Destino: ${e.endereco} - ${e.cidade||''}<br>
    📏 ${e.distancia_km||'?'} km ${e.chovendo?'(🌧️ +R$ 2 chuva)':''}<br>
    <div class="row-botoes">
      <button class="btn btn-green" style="margin-top:8px;flex:2" onclick="aceitar('${e.id}')">✅ Aceitar Corrida</button>
      <button class="btn btn-red" style="margin-top:8px;flex:1" onclick="recusar('${e.id}')">❌ Recusar</button>
    </div></div>`).join('')||'<p style="font-size:13px;color:#666">Nenhuma entrega na fila no momento.</p>';

  // 3. Extrato Financeiro
  const hojeStr = new Date().toISOString().split('T')[0];
  const {data: entregues} = await supabaseClient.from('entregas').select('*').eq('motoboy_id', motoId).eq('status','entregue');
  let ganhoHoje = 0, ganhoMes = 0, qtdHoje = 0, qtdMes = 0;
  const mesAtual = hojeStr.substring(0,7);

  (entregues||[]).forEach(e => {
    const val = Number(e.valor_motoboy || 0);
    const dataEntrega = (e.entregue_em || '').split('T')[0];
    if(dataEntrega === hojeStr){ ganhoHoje += val; qtdHoje++; }
    if(dataEntrega.startsWith(mesAtual)){ ganhoMes += val; qtdMes++; }
  });

  document.getElementById('extratoMoto').innerHTML = `
    <b>Hoje (${qtdHoje} entregas):</b> R$ ${ganhoHoje.toFixed(2)}<br>
    <b>Este Mês (${qtdMes} entregas):</b> R$ ${ganhoMes.toFixed(2)}<br>
    <small style="color:#666">Chave Pix: ${motoData.chave_pix || 'Não cadastrada'}</small>
  `;
}

// Mapa com Leaflet e Ícone de Moto
function inicializarMapa(entrega){
  if(!map){
    map = L.map('map').setView([-20.45, -50.55], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(map);
  }

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      const motoIcon = L.divIcon({
        html: '<div style="font-size:24px;background:#fff;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)">🛵</div>',
        className: 'custom-moto-icon', iconSize: [36, 36], iconAnchor: [18, 18]
      });

      if(!markerMotoboy){
        markerMotoboy = L.marker([lat, lng], {icon: motoIcon}).addTo(map).bindPopup('Sua Moto');
      } else {
        markerMotoboy.setLatLng([lat, lng]);
      }
      map.setView([lat, lng], 15);
    });
  }
}

async function aceitar(id){
  const {data, error} = await supabaseClient.from('entregas').update({
    status: 'aceita', 
    motoboy_id: motoId, 
    motoboy_nome: motoData.nome_completo || motoData.nome,
    motoboy_placa: motoData.placa_moto || motoData.placa,
    aceita_em: new Date().toISOString()
  }).eq('id', id).eq('status','pendente').select().maybeSingle();

  if(error || !data) return alert('Esta corrida já foi aceita por outro motoboy.');
  
  // Atualiza métrica do motoboy
  await supabaseClient.from('motoboys').update({total_aceitas: (motoData.total_aceitas || 0) + 1}).eq('id', motoId);

  alert('Corrida aceita! Siga para a loja.');
  carregar();
}

async function recusar(id){
  const {data: ent} = await supabaseClient.from('entregas').select('recusados_por').eq('id', id).maybeSingle();
  const lista = ent?.recusados_por || [];
  if(!lista.includes(motoId)) lista.push(motoId);

  await supabaseClient.from('entregas').update({recusados_por: lista}).eq('id', id);
  carregar();
}

async function confirmarRetirada(id){
  const pinInput = document.getElementById('pinRetirada-'+id).value.trim();
  if(!pinInput || pinInput.length !== 4) return alert('Digite o PIN de 4 dígitos informado pela loja.');
  
  const {data} = await supabaseClient.from('entregas').select('codigo_retirada').eq('id', id).maybeSingle();
  if(!data || pinInput !== data.codigo_retirada) return alert('❌ PIN de retirada incorreto! Confirme com o atendente da loja.');

  await supabaseClient.from('entregas').update({status: 'retirada', retirada_confirmada: true, coletada_em: new Date().toISOString()}).eq('id', id);
  alert('✅ Retirada confirmada! Rota aberta até o cliente.');
  carregar();
}

async function finalizar(id){
  const pin = document.getElementById('pin-'+id).value.trim();
  if(!pin || pin.length!==4) return alert('Digite o PIN de 4 dígitos informado pelo cliente');
  
  const {data} = await supabaseClient.from('entregas').select('codigo_entrega').eq('id',id).maybeSingle();
  if(!data || pin !== data.codigo_entrega) return alert('❌ PIN do cliente incorreto!');
  
  await supabaseClient.from('entregas').update({status:'entregue', entregue_em: new Date().toISOString(), codigo_confirmado:true}).eq('id',id);
  alert('✅ Entrega finalizada com sucesso! Bom trabalho.');
  carregar();
}

function alternarConfig(){
  const b = document.getElementById('boxConfig');
  b.style.display = b.style.display==='block' ? 'none' : 'block';
}

async function salvarSenhaMoto(){
  const nova = document.getElementById('novaSenhaMoto').value;
  if(!nova || nova.length<4) return alert('Senha inválida');
  const {error} = await supabaseClient.from('motoboys').update({senha: nova}).eq('id', motoId);
  if(error) return alert('Erro: '+error.message);
  alert('Senha alterada com sucesso!');
  document.getElementById('novaSenhaMoto').value='';
}

sincronizarEstadoInicial().then(() => {
  carregar();
});

// Atualiza a cada 8 segundos se estiver online
setInterval(()=>{ 
  if(onlineAtual) carregar(); 
}, 8000);
</script>
</body></html>
